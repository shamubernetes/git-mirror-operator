{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "git-mirror-operator.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    name: {{ include "git-mirror-operator.resourceName" (dict "suffix" "gitmirror-viewer-role" "context" $) }}
rules:
    - apiGroups:
        - mirror.shamubernetes.com
      resources:
        - gitmirrors
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - mirror.shamubernetes.com
      resources:
        - gitmirrors/status
      verbs:
        - get
{{- end }}
